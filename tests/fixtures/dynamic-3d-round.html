<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Coordinate 3D browser fixture</title>
  <style>
    body { margin: 12px; font-family: Arial, sans-serif; background: white; color: #222; }
    .flex-child { width: 820px; min-width: 0; }
    .jxgbox { position: relative; overflow: hidden; }
  </style>
</head>
<body>
<main id="fixture">
  <section class="flex-child">
    <lia-coordinate-board data-lia-coordinate-key="segment-1-3d"
      data-spec="id=raum;mode=3d;xmin=-5;xmax=5;ymin=-5;ymax=5;zmin=-6;zmax=6;width=760;projection=parallel;camera=0.9/0.45/0"></lia-coordinate-board>
    <span id="point3d-spec-a" data-spec="raum;A;1;2;3;#d400d4;1" style="display:none"></span>
    <span id="point3d-spec-b" data-spec="raum;B;-2;1;-2.5;#1565c0;0.8;fix" style="display:none"></span>
    <span id="point3d-spec-c" data-spec="raum;C;0.5;-1;0.25;#00897b;1" style="display:none"></span>
    <span id="point3d-spec-d" data-spec="raum;D;0;0;0;#8d7cff;1" style="display:none"></span>
    <span id="linear3d-spec-macro-segment" data-kind="segment" data-language="de" data-spec="raum;ms;A;B;#ef6c00;textcolor=#6a1b9a;opacity=0.75;width=4;linestyle=dashed;layer=6;wert=1;objectid=macro-segment-id" style="display:none"></span>
    <span id="linear3d-spec-macro-line" data-kind="line" data-language="en" data-spec="raum;mg;B;C;#1565c0;textcolor=#00897b;value=1;objectid=macro-line-id" style="display:none"></span>
    <span id="linear3d-spec-macro-ray" data-kind="ray" data-language="de" data-spec="raum;mr;C;A;#2e7d32;wert=1;objectid=macro-ray-id" style="display:none"></span>
    <span id="linear3d-spec-macro-vector" data-kind="vector" data-language="en" data-spec="raum;mv;A;C;#c2185b;value=1;objectid=macro-vector-id" style="display:none"></span>
    <span id="linear3d-spec-macro-free-vector" data-kind="vector" data-language="de" data-spec="raum;mf;B;[-1.5;2.25;0.5];#5e35b1;textcolor=#f4511e;opacity=0.6;fixed=1;layer=7;width=5;linestyle=dotted;wert=1;objectid=macro-free-vector-id" style="display:none"></span>
    <span id="plane3d-spec-macro-plane-points" data-definition="three-points" data-language="de" data-spec="raum;E;A;B;C;#00acc1;0.24;linecolor=#00838f;textcolor=#6a1b9a;wert=1;equation=coordinate;objectid=macro-plane-points-id" style="display:none"></span>
    <span id="plane3d-spec-macro-plane-normal" data-definition="point-normal" data-language="en" data-spec="raum;F;B;mv;#ef6c00;0.18;value=1;equation=normal;objectid=macro-plane-normal-id" style="display:none"></span>
    <span id="plane3d-spec-macro-plane-vectors" data-definition="point-vectors" data-language="de" data-spec="raum;G;C;mv;mf;#7b1fa2;0.2;wert=1;equation=parameter;objectid=macro-plane-vectors-id" style="display:none"></span>
    <span id="circle3d-spec-macro-circle-points" data-definition="three-points" data-language="de" data-spec="raum;k;A;B;C;#00dfe8;wert=1;objectid=macro-circle-points-id" style="display:none"></span>
    <span id="circle3d-spec-macro-circle-radius" data-definition="center-normal-radius" data-language="en" data-spec="raum;c;A;mv;#ffaa00;radius=2;value=1;objectid=macro-circle-radius-id" style="display:none"></span>
    <span id="circle3d-spec-macro-circle-point" data-definition="center-normal-point" data-language="de" data-spec="raum;d;B;mv;C;#42d66b;wert=1;objectid=macro-circle-point-id" style="display:none"></span>
    <span id="sphere3d-spec-macro-sphere-point" data-definition="center-point" data-language="de" data-spec="raum;S;A;B;#8d7cff;opacity=0.18;wert=1;objectid=macro-sphere-point-id" style="display:none"></span>
    <span id="sphere3d-spec-macro-sphere-radius" data-definition="center-radius" data-language="en" data-spec="raum;T;D;#42d66b;radius=3;opacity=0.2;value=1;objectid=macro-sphere-radius-id" style="display:none"></span>
    <span id="sphere3d-spec-macro-sphere-four" data-definition="four-points" data-language="de" data-spec="raum;U;A;B;C;D;#ff6688;opacity=0.16;wert=1;objectid=macro-sphere-four-id" style="display:none"></span>
    <span id="intersection3d-spec-macro-round-intersection" data-language="de" data-spec="raum;i;T;E;#ff00ff;0.9;objectid=macro-round-intersection-id" style="display:none"></span>
    <div id="dgs-ui-segment-1-3d" data-spec="raum" data-language="de"></div>
  </section>
</main>
<script>
  window.profileErrors = [];
  window.addEventListener('error', event => profileErrors.push(String(event.error?.stack || event.message)));
  window.addEventListener('unhandledrejection', event => profileErrors.push(String(event.reason)));
</script>
<script>window.MathJax = { chtml: { fontURL: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2" } };</script>
<script src="/assets/mathjax.js"></script>
<script src="/assets/jsxgraph-template.js"></script>
<script src="/bundle.js"></script>
<script>
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  window.profileReady = async () => {
    for (let i = 0; i < 180; i += 1) {
      const board = window.__boards?.raum;
      const points = window.__points?.raum || {};
      if (board && window.__coordinateViews3d?.raum && points.A && points.B && points.C &&
          board.containerObj.querySelector('.lia-dgs-point-button')) return true;
      await wait(50);
    }
    throw Error('3D initialization timeout: ' + JSON.stringify(profileErrors));
  };
  window.pointScreen = name => {
    const point = __points.raum[name];
    const projected = point.element2D || point;
    const rect = __boards.raum.containerObj.getBoundingClientRect();
    return [rect.left + projected.coords.scrCoords[1], rect.top + projected.coords.scrCoords[2]];
  };
</script>
</body>
</html>
